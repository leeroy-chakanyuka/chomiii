services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chomiii
      POSTGRES_USER: ${CHOMIII_DB_USER:-chomiii}
      POSTGRES_PASSWORD: ${CHOMIII_DB_PASSWORD:?Set CHOMIII_DB_PASSWORD for local Docker development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      CHOMIII_DB_URL: jdbc:postgresql://db:5432/chomiii
      CHOMIII_DB_USER: ${CHOMIII_DB_USER:-chomiii}
      CHOMIII_DB_PASSWORD: ${CHOMIII_DB_PASSWORD:?Set CHOMIII_DB_PASSWORD for local Docker development}
      CHOMIII_PUBLIC_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres_data:
