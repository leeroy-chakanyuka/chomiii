spring:
  application:
    name: chomiii
  # MySQL locally, PostgreSQL in CI and production. The active profile is
  # never implied by secrets: local is the working default, prod is chosen
  # explicitly. Datasource configuration lives only in the profile files.
  profiles:
    default: local
  flyway:
    locations: classpath:db/migration

chomiii:
  browserbase:
    enabled: ${CHOMIII_BROWSERBASE_ENABLED:false}
    api-key: ${BROWSERBASE_API_KEY:}
    project-id: ${BROWSERBASE_PROJECT_ID:}
    allowed-hosts: ${CHOMIII_BROWSERBASE_ALLOWED_HOSTS:}
